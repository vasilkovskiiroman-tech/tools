<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка цен · Polaris</title>
<style>
  :root{
    --bg:#0b0e16;
    --card:#141a26;
    --card-line:#232c3d;
    --accent:#f5a623;
    --text:#eef2f8;
    --muted:#8f9ab3;
    --ok:#4ade80;
    --bad:#f87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:560px;padding:28px 20px 60px;}
  .eyebrow{color:var(--muted);font-size:13px;letter-spacing:.04em;}
  h1{font-size:24px;margin:6px 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px;}

  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  input[type=text], input[type=number], select{
    width:100%;
    background:#0f141f;
    border:1px solid var(--card-line);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:16px;
  }
  input:focus, select:focus{outline:2px solid var(--accent);}

  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .progress-bar{flex:1;height:4px;background:var(--card-line);border-radius:2px;margin-right:14px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .2s;}
  .progress-num{color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap;}

  .item-name{font-size:18px;font-weight:600;margin-bottom:4px;line-height:1.3;}
  .item-art{color:var(--muted);font-size:13px;margin-bottom:18px;}

  .status-row{display:flex;gap:10px;margin-bottom:14px;}
  .status-btn{
    flex:1;padding:12px;border-radius:10px;border:1px solid var(--card-line);
    background:#0f141f;color:var(--text);font-size:14px;cursor:pointer;
  }
  .status-btn.active-ok{border-color:var(--ok);color:var(--ok);}
  .status-btn.active-bad{border-color:var(--bad);color:var(--bad);}

  .drop{
    border:2px dashed var(--card-line); border-radius:14px; padding:28px 16px;
    text-align:center; color:var(--muted); font-size:14px; margin-top:16px; cursor:pointer;
  }
  .drop.has-files{border-color:var(--accent); color:var(--text);}
  input[type=file]{display:none;}
  .thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .thumbs img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--card-line);}
  .photo-status{margin-top:14px; font-size:14px; text-align:center;}
  .photo-status.ok{color:var(--ok);}
  .photo-status.bad{color:var(--bad);}

  .sync{margin-top:14px; font-size:13px; text-align:center; color:var(--muted); min-height:18px;}
  .sync.ok{color:var(--ok);}
  .sync.bad{color:var(--bad);}

  .nav-row{display:flex;gap:10px;margin-top:20px;}
  button.nav{
    flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#1a1204;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:#0f141f;color:var(--text);border:1px solid var(--card-line);}
  .btn-secondary:disabled{opacity:.4;cursor:default;}

  .field-name{display:flex;flex-direction:column;gap:14px;}

  .done h2{font-size:20px;}
  .done p{color:var(--muted);font-size:14px;line-height:1.5;}
  .hidden{display:none;}
</style>
</head>

<div class="wrap">

        <button class="nav btn-secondary" onclick="discardSaved()">Начать заново</button>
      </div>
    </div>

    <div class="card field-name">
      <div>
        <label>ВАШЕ ИМЯ И ФАМИЛИЯ</label>
        <input type="text" id="employeeName" placeholder="Например: Иванов Иван">

      <div>
        <label>МАГАЗИН</label>

          <option value="20" selected>№ 20</option>

      </div>
    </div>
    <div class="nav-row">

    </div>
  </div>

  <!-- ЭКРАН 1: карточка товара -->
  <div id="screen-item" class="hidden">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">1/89</div>
    </div>
    <div class="card">
      <div class="eyebrow" id="itemCategory" style="margin-bottom:6px;"></div>
      <div class="item-name" id="itemName"></div>
      <div class="item-art" id="itemArt"></div>

      <label>ЦЕНА (текущая, со скидкой если есть)</label>
      <input type="number" id="priceInput" placeholder="Например: 1499" inputmode="numeric">

      <div class="status-row" style="margin-top:14px;">
        <button class="status-btn" id="btnNoAvail" onclick="setStatus('нет')" style="flex:none;width:100%;">Нет в наличии</button>
      </div>

      <div class="drop" id="photoDrop">📷 Добавить фото</div>
      <input type="file" id="photoInput" accept="image/*" multiple>
      <div class="thumbs" id="photoThumbs"></div>
      <div class="photo-status" id="photoStatus"></div>
    </div>
    <div class="nav-row">
      <button class="nav btn-secondary" id="btnBack" onclick="prevItem()">Назад</button>
      <button class="nav btn-primary" onclick="nextItem()">Далее</button>
    </div>
    <div class="sync" id="syncStatus"></div>
  </div>

  <!-- ЭКРАН 2: готово -->
  <div id="screen-done" class="hidden">
    <div class="card done">
      <h2>Готово</h2>
      <p id="doneSummary"></p>
    </div>
    <div class="nav-row">
      <button class="nav btn-primary" id="btnSubmit" onclick="submitAll()">Отправить отчёт</button>
    </div>
  </div>

</div>

let results = ITEMS.map(it => ({...it, price:"", status:"", photoSent:false}));
let employeeName = "", store = "";

// ---- Отправка цен в таблицу: по одной позиции, сразу после «Далее» ----
let sentSig = {};      // индекс позиции -> что уже отправлено ("статус|цена")
let queue = [];        // индексы позиций, ожидающих отправки
let sending = false;
let lastError = false;
let retryTimer = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const sigOf = r => r.status + "|" + r.price;

// ---- Сохранение на телефоне (чтобы перезагрузка страницы не стирала введённое) ----
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function persist(){
  if(!employeeName) return;
  lsSet(STORAGE_KEY, JSON.stringify({
    ts: Date.now(), employeeName: employeeName, store: store, current: current,
    results: results.map(r => ({price:r.price, status:r.status, photoSent:!!r.photoSent})),
    sentSig: sentSig, queue: queue
  }));
}

function loadSaved(){
  const raw = lsGet(STORAGE_KEY);
  if(!raw) return null;
  try{
    const s = JSON.parse(raw);
    if(!s || !s.employeeName || !Array.isArray(s.results) || s.results.length !== ITEMS.length) return null;
    if(Date.now() - (s.ts||0) > RESUME_MAX_AGE_MS) return null;
    return s;
  }catch(e){ return null; }
}

function showResumeIfAny(){
  const s = loadSaved();
  if(!s) return;
  const done = s.results.filter(r => r.status).length;
  if(!done) return;
  document.getElementById('resumeText').textContent =
    "Найден незавершённый отчёт: " + s.employeeName + ", магазин № " + s.store +
    ", заполнено " + done + " из " + ITEMS.length + ". Продолжить с того же места?";
  document.getElementById('resumeCard').classList.remove('hidden');
}

function resumeSaved(){
  const s = loadSaved();
  if(!s){ discardSaved(); return; }
  employeeName = s.employeeName;
  store = String(s.store);
  current = Math.min(Math.max(s.current|0, 0), ITEMS.length - 1);
  results = ITEMS.map((it,i) => ({...it,
    price: s.results[i].price || "",
    status: s.results[i].status || "",
    photoSent: !!s.results[i].photoSent}));
  sentSig = s.sentSig || {};
  queue = Array.isArray(s.queue) ? s.queue.filter(i => i >= 0 && i < ITEMS.length) : [];
  // всё, что отмечено, но не подтверждено как отправленное, — в очередь
  results.forEach((r,i) => { if(r.status && sentSig[i] !== sigOf(r) && !queue.includes(i)) queue.push(i); });
  document.getElementById('employeeName').value = employeeName;
  document.getElementById('storeSelect').value = store;
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-item').classList.remove('hidden');
  renderItem();
  pump();
}

function discardSaved(){
  lsDel(STORAGE_KEY);
  document.getElementById('resumeCard').classList.add('hidden');
}

function startChecklist(){
  employeeName = document.getElementById('employeeName').value.trim();
  store = document.getElementById('storeSelect').value;
  if(!employeeName){ alert("Заполните имя"); return; }
  current = 0;
  results = ITEMS.map(it => ({...it, price:"", status:"", photoSent:false}));
  sentSig = {}; queue = [];
  persist();
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-item').classList.remove('hidden');
  renderItem();
}

function renderItem(){
  const it = ITEMS[current];
  document.getElementById('itemCategory').textContent = it.category;
  document.getElementById('itemName').textContent = it.name;
  document.getElementById('itemArt').textContent = "Артикул " + it.article;
  document.getElementById('priceInput').value = results[current].price;
  document.getElementById('progressNum').textContent = (current+1) + "/" + ITEMS.length;
  document.getElementById('progressFill').style.width = ((current)/ITEMS.length*100) + "%";
  document.getElementById('btnBack').disabled = (current === 0);
  highlightStatus();

  // сброс/восстановление блока фото под конкретный товар
  document.getElementById('photoInput').value = "";
  document.getElementById('photoThumbs').innerHTML = "";
  const pDrop = document.getElementById('photoDrop');
  const pStatus = document.getElementById('photoStatus');
  pStatus.className = 'photo-status';
  pStatus.textContent = "";
  if(results[current].photoSent){
    pDrop.textContent = "📷 Фото уже приложено (можно добавить ещё)";
    pDrop.classList.add('has-files');
    pStatus.textContent = "Фото отправлено ✓";
    pStatus.className = 'photo-status ok';
  } else {
    pDrop.textContent = "📷 Добавить фото";
    pDrop.classList.remove('has-files');
  }
  updateSync();
}

function setStatus(s){
  results[current].status = s;
  if(s === "нет"){
    results[current].price = "";
    document.getElementById('priceInput').value = "";
  }
  highlightStatus();
  persist();
}

function highlightStatus(){
  const b = document.getElementById('btnNoAvail');
  b.classList.remove('active-bad');
  if(results[current].status === 'нет') b.classList.add('active-bad');
}

// цена набирается — запоминаем на телефоне; если раньше было «нет в наличии», а цену ввели — значит товар есть
document.getElementById('priceInput').addEventListener('input', (e) => {
  const v = e.target.value;
  results[current].price = v;
  if(v && results[current].status === 'нет'){
    results[current].status = 'есть';
    highlightStatus();
  }
  persist();
});

function saveCurrent(){
  results[current].price = document.getElementById('priceInput').value;
}

function nextItem(){
  saveCurrent();
  if(!results[current].status){
    if(results[current].price){
      results[current].status = 'есть'; // цена введена — считаем "в наличии" автоматически
    } else {
      alert("Введите цену или нажмите \"Нет в наличии\"");
      return;
    }
  }
  markDirty(current);
  if(current < ITEMS.length - 1){
    current++;
    persist();
    renderItem();
  } else {
    persist();
    showDone();
  }
}

function prevItem(){
  saveCurrent();
  markDirty(current);
  if(current > 0){
    current--;
    persist();
    renderItem();
  }
}

function showDone(){
  document.getElementById('screen-item').classList.add('hidden');
  document.getElementById('screen-done').classList.remove('hidden');
  const filled = results.filter(r => r.status).length;
  document.getElementById('doneSummary').textContent =
    "Проверено позиций: " + filled + " из " + ITEMS.length + ". Цены уже уходят в таблицу; нажмите «Отправить отчёт», чтобы убедиться, что всё дошло.";
}

// ---- Очередь отправки ----
function markDirty(idx){
  const r = results[idx];
  if(!r.status) return;
  if(sentSig[idx] === sigOf(r)) return;
  if(!queue.includes(idx)) queue.push(idx);
  persist();
  pump();
}

async function postJson(url, obj, timeoutMs, tries){
  const body = JSON.stringify(obj);
  for(let a = 1; a <= tries; a++){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try{
      await fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type":"text/plain"},
        body: body,
        signal: ctrl.signal
      });
      clearTimeout(t);
      return true;
    }catch(e){
      clearTimeout(t);
      if(a < tries) await sleep(1500 * a);
    }
  }
  return false;
}

async function pump(){
  if(sending) return;
  sending = true;
  lastError = false;
  updateSync();
  while(queue.length){
    const idx = queue[0];
    const r = results[idx];
    const sig = sigOf(r);
    if(!r.status || sentSig[idx] === sig){ queue.shift(); continue; }
    const ok = await postJson(ENDPOINT_URL, {
      employee: employeeName,
      store: store,
      timestamp: new Date().toISOString(),
      items: [{article:r.article, name:r.name, category:r.category, price:r.price, status:r.status}]
    }, 30000, 3);
    if(ok){
      sentSig[idx] = sig;
      if(queue[0] === idx) queue.shift();
      // если пока шла отправка значение поменяли — отправим ещё раз
      const now = results[idx];
      if(now.status && sigOf(now) !== sig && !queue.includes(idx)) queue.push(idx);
      persist();
      updateSync();
    } else {
      lastError = true;
      break;
    }
  }
  sending = false;
  persist();
  updateSync();
  if(lastError && queue.length){
    clearTimeout(retryTimer);
    retryTimer = setTimeout(pump, 8000);
  }
}

window.addEventListener('online', () => { if(queue.length) pump(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && queue.length) pump();
});

function updateSync(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  const n = queue.length;
  const anySent = Object.keys(sentSig).length > 0;
  if(n && sending){
    el.textContent = "Отправка в таблицу… (в очереди: " + n + ")";
    el.className = "sync";
  } else if(n && lastError){
    el.textContent = "Нет связи. Введённое сохранено на телефоне, отправим автоматически (в очереди: " + n + ")";
    el.className = "sync bad";
  } else if(n){
    el.textContent = "В очереди на отправку: " + n;
    el.className = "sync";
  } else if(anySent){
    el.textContent = "Все введённые цены отправлены в таблицу ✓";
    el.className = "sync ok";
  } else {
    el.textContent = "";
    el.className = "sync";
  }
}

async function flushAll(){
  while(sending) await sleep(300);
  await pump();
  while(sending) await sleep(300);
}

async function submitAll(){
  const btn = document.getElementById('btnSubmit');
  const p = document.getElementById('doneSummary');
  btn.disabled = true;
  btn.textContent = "Отправка…";
  p.textContent = "Отправляю…";

  // всё отмеченное, что ещё не подтверждено, — в очередь
  results.forEach((r,i) => { if(r.status && sentSig[i] !== sigOf(r) && !queue.includes(i)) queue.push(i); });
  persist();

  // дожидаемся фото, которые ещё загружаются
  let waited = 0;
  while(photosPending > 0 && waited < 180000){ await sleep(500); waited += 500; }

  await flushAll();

  const total = results.filter(r => r.status).length;
  const confirmed = results.filter((r,i) => r.status && sentSig[i] === sigOf(r)).length;

  if(confirmed === total && !queue.length){
    p.textContent = "Отчёт отправлен. Спасибо! Позиций в таблице: " + confirmed + ".";
    lsDel(STORAGE_KEY);
    btn.textContent = "Отправлено ✓";
  } else {
    p.textContent = "Отправлено " + confirmed + " из " + total + ". Нет связи — данные сохранены на телефоне. Нажмите «Отправить отчёт» ещё раз, когда появится интернет.";
    btn.disabled = false;
    btn.textContent = "Отправить отчёт";
  }
}

// ---- Фото: сжимаем по одному (лёгко для памяти) и сразу отправляем в фоне ----
let photoChain = Promise.resolve();
let photosPending = 0;

function loadImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({img: img, url: url});
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}

async function resizeImage(file, maxSize, quality){
  maxSize = maxSize || 1280;
  quality = quality || 0.7;
  const loaded = await loadImage(file);
  const img = loaded.img;
  try{
    const w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, maxSize / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
    const full = canvas.toDataURL('image/jpeg', quality);
    // маленькая миниатюра из уже уменьшенного кадра (не держим в памяти большой оригинал)
    const tk = 96 / Math.max(cw, ch);
    const tc = document.createElement('canvas');
    tc.width = Math.max(1, Math.round(cw * tk)); tc.height = Math.max(1, Math.round(ch * tk));
    tc.getContext('2d').drawImage(canvas, 0, 0, tc.width, tc.height);
    const thumb = tc.toDataURL('image/jpeg', 0.6);
    canvas.width = canvas.height = 0;
    tc.width = tc.height = 0;
    return {full: full, thumb: thumb};
  } finally {
    URL.revokeObjectURL(loaded.url);
    img.src = "";
  }
}

function setPhotoUi(idx, text, cls){
  if(idx !== current) return;
  const pStatus = document.getElementById('photoStatus');
  pStatus.textContent = text;
  pStatus.className = 'photo-status' + (cls ? ' ' + cls : '');
}

function addThumb(idx, src){
  if(idx !== current) return;
  const img = document.createElement('img');
  img.src = src;
  document.getElementById('photoThumbs').appendChild(img);
}

async function uploadPhotos(files, idx, st){
  let okCount = 0, fail = 0;
  for(const f of files){
    try{
      const res = await resizeImage(f);
      addThumb(idx, res.thumb);
      const ok = await postJson(PHOTO_ENDPOINT_URL, {store: st, item: ITEMS[idx].name, photos: [res.full]}, 60000, 3);
      if(ok) okCount++; else fail++;
    }catch(err){
      fail++;
    }
  }
  if(okCount){ results[idx].photoSent = true; persist(); }
  if(idx === current){
    const pDrop = document.getElementById('photoDrop');
    if(okCount){
      pDrop.textContent = "📷 Фото уже приложено (можно добавить ещё)";
      pDrop.classList.add('has-files');
    }
    if(fail){
      setPhotoUi(idx, "Не все фото отправились, добавьте ещё раз", 'bad');
    } else {
      setPhotoUi(idx, "Фото отправлено ✓", 'ok');
    }
  }
}

document.getElementById('photoInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  if(!files.length) return;
  const idx = current;
  const st = store;
  photosPending++;
  setPhotoUi(idx, "Отправка фото...", "");
  photoChain = photoChain
    .then(() => uploadPhotos(files, idx, st))
    .catch(() => {})
    .then(() => { photosPending--; });
});

document.getElementById('photoDrop').addEventListener('click', () => {
  document.getElementById('photoInput').click();
});

showResumeIfAny();
</script>
