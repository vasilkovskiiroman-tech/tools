<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Продажи и заказ · Polaris</title>
<style>
  :root{
    --bg:#0b0e16;
    --card:#141a26;
    --card-line:#232c3d;
    --accent:#f5a623;
    --text:#eef2f8;
    --muted:#8f9ab3;
    --ok:#4ade80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:560px;padding:28px 20px 60px;}
  .eyebrow{color:var(--muted);font-size:13px;letter-spacing:.04em;}
  h1{font-size:24px;margin:6px 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px;}

  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;min-height:32px;}
  input[type=text], input[type=number], select{
    width:100%;
    background:#0f141f;
    border:1px solid var(--card-line);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:16px;
  }
  input:focus, select:focus{outline:2px solid var(--accent);}

  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .progress-bar{flex:1;height:4px;background:var(--card-line);border-radius:2px;margin-right:14px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .2s;}
  .progress-num{color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap;}

  .item-name{font-size:18px;font-weight:600;margin-bottom:4px;line-height:1.3;}
  .item-art{display:inline-block;margin-bottom:12px;padding:8px 14px;border-radius:10px;
    background:#1f1808;border:1px solid var(--accent);color:var(--accent);
    font-size:32px;font-weight:800;letter-spacing:.06em;line-height:1.1;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  .item-art:empty{display:none;}
  .item-art-label{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;}
  .item-name{margin-bottom:18px !important;}

  /* 3 поля столбиком, одно под другим */
  .field-col{display:flex;flex-direction:column;gap:14px;}
  .field-col > div{display:flex;flex-direction:column;}

  .nav-row{display:flex;gap:10px;margin-top:20px;}
  button.nav{
    flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#1a1204;}
  .btn-secondary{background:#0f141f;color:var(--text);border:1px solid var(--card-line);}
  .btn-secondary:disabled{opacity:.4;cursor:default;}

  .field-name{display:flex;flex-direction:column;gap:14px;}

  .done h2{font-size:20px;}
  .done p{color:var(--muted);font-size:14px;line-height:1.5;}
  .hidden{display:none;}
  .sync{margin-top:14px;font-size:13px;text-align:center;color:var(--muted);min-height:18px;}
  .sync.ok{color:var(--ok);}
  .sync.bad{color:#f87171;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ЭКРАН 0: имя + магазин -->
  <div id="screen-start">
    <div class="eyebrow">POLARIS · METRO</div>
    <h1>Продажи и заказ</h1>
    <div class="sub">Заполните остаток, заказ и продажи за неделю по каждой позиции.</div>
    <div class="card hidden" id="resumeCard">
      <div id="resumeText" style="font-size:14px;line-height:1.5;margin-bottom:14px;"></div>
      <div class="nav-row" style="margin-top:0;">
        <button class="nav btn-primary" onclick="resumeSaved()">Продолжить</button>
        <button class="nav btn-secondary" onclick="discardSaved()">Начать заново</button>
      </div>
    </div>
    <div class="card field-name">
      <div>
        <label>ВАШЕ ИМЯ И ФАМИЛИЯ</label>
        <input type="text" id="employeeName" placeholder="Например: Иванов Иван">
      </div>
      <div>
        <label>МАГАЗИН</label>
        <select id="storeSelect">
          <option value="15">№ 15 · Комендантский</option>
          <option value="16">№ 16 · Косыгина</option>
          <option value="20" selected>№ 20 · Пулковское</option>
        </select>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav btn-primary" onclick="startChecklist()">Начать</button>
    </div>
  </div>

  <!-- ЭКРАН 1: карточка товара -->
  <div id="screen-item" class="hidden">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum"></div>
    </div>
    <div class="card">
      <div class="item-art-label">АРТИКУЛ ДЛЯ ТЕРМИНАЛА</div>
      <div class="item-art" id="itemArt"></div>
      <div class="item-name" id="itemName"></div>

      <div class="field-col">
        <div>
          <label>ОСТАТОК</label>
          <input type="number" id="stockInput" placeholder="0" inputmode="numeric">
        </div>
        <div>
          <label>ЗАКАЗ ТЕКУЩИЙ</label>
          <input type="number" id="orderInput" placeholder="0" inputmode="numeric">
        </div>
        <div>
          <label>ПРОДАЖИ ЗА НЕДЕЛЮ</label>
          <input type="number" id="salesInput" placeholder="0" inputmode="numeric">
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav btn-secondary" id="btnBack" onclick="prevItem()">Назад</button>
      <button class="nav btn-primary" onclick="nextItem()">Далее</button>
    </div>
    <div class="sync" id="syncStatus"></div>
  </div>

  <!-- ЭКРАН 2: готово -->
  <div id="screen-done" class="hidden">
    <div class="card done">
      <h2>Готово</h2>
      <p id="doneSummary"></p>
    </div>
    <div class="nav-row">
      <button class="nav btn-primary" id="btnSubmit" onclick="submitAll()">Отправить отчёт</button>
    </div>
    <div class="sync" id="syncStatusDone"></div>
  </div>

</div>

<script>
// ЗАМЕНИТЕ на URL вашего Apps Script Web App (doPost), полученный при развёртывании
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyEJBx0R9MrXqkxAxJRrCbhJIfm5Zmbp7w8V7Agmi7L-oBROUX6jL31PYFCkm0_COBzmw/exec";

// 39 позиций — как на листе "Лист1" таблицы "Метро регулярная таблица" (с 03.11.2026):
// 26 регулярных + 13 коллекции. Строка в таблице ищется по артикулу (Art Subsys).
const ITEMS = [
  {article:"6699", name:"Аэрогриль электрический PAF 5502 Черный POLARIS CN"},
  {article:"6751", name:"Аэрогриль электрический PAF 8003W WIFI IQ Home Черный POLARIS CN"},
  {article:"76918", name:"Блендер настольный PTB 1037G Графитовый POLARIS CN"},
  {article:"127236", name:"Блендер ручной PHB 1397 Черный POLARIS CN"},
  {article:"210901", name:"Блендер ручной PHB 1476 черный POLARIS CN"},
  {article:"76924", name:"Блендер ручной PHB 1510GL Silent Черный POLARIS CN"},
  {article:"76883", name:"Весы напольные электронные PWS 1896 IQ Home Антрацит POLARIS CN"},
  {article:"258380", name:"Весы напольные электронные PWS 1898 IQ Home Серый POLARIS CN"},
  {article:"228429", name:"Концентрированное средство для удаления накипи PCDL 1005 ECO Белый POLARIS"},
  {article:"219437", name:"Кофеварка 3-in-1 PCM 2020 Нержавеющая сталь/черный POLARIS CN"},
  {article:"76882", name:"Кофемашина PACM 2071AC Черный (POLARIS)"},
  {article:"76884", name:"Кофемолка PCG 2014 Белый POLARIS CN"},
  {article:"213268", name:"Миксер PHM 7021 Белый POLARIS CN"},
  {article:"97237", name:"Мультиварка PMC 0397 3 Л Polaris"},
  {article:"135176", name:"Мультиварка PMC 0593AD серебряный POLARIS CN"},
  {article:"127237", name:"Мясорубка PMG 2050 RUS"},
  {article:"22067", name:"Парогенератор PSS 7510K Зеленый/черный POLARIS CN"},
  {article:"98743", name:"Печь микроволновая PMO 2002DG RUS с грилем Черный POLARIS RU"},
  {article:"657806", name:"Прибор для выпечки PST 0105 черный POLARIS CN"},
  {article:"616873", name:"Пылесос PVC 2003RI Серый POLARIS CN"},
  {article:"76916", name:"Пылесос портативный PVCS 4010 FusionPRO Белый POLARIS CN"},
  {article:"76893", name:"Утюг PIR 2497AK 3m Белый/розовый POLARIS CN"},
  {article:"213276", name:"Утюг PIR 2821AK 3m Черный/Бирюзовый POLARIS CN"},
  {article:"76747", name:"Электрочайник PWK 1712CGLD WIFI IQ Home Черный POLARIS CN"},
  {article:"76748", name:"Электрочайник PWK 1739CGL Сталь POLARIS CN"},
  {article:"76880", name:"Электрочайник PWK 1865CA Стальной POLARIS CN"},
  {article:"212334", name:"Аэрогриль электрический PAF 6020 Серебряный POLARIS CN"},
  {article:"212406", name:"Блендер ручной PHB 1450 Черный POLARIS CN"},
  {article:"212340", name:"Блендер ручной PHB 1540L Черный POLARIS CN"},
  {article:"211839", name:"Кофемашина PACM 2056AC Черный (POLARIS)"},
  {article:"211838", name:"Мясорубка PMG 2040 Черный POLARIS CN"},
  {article:"283926", name:"Мясорубка PMG 2058 Графитовый POLARIS CN"},
  {article:"211840", name:"Отпариватель компактный PGS 1480C Белый POLARIS CN"},
  {article:"212328", name:"Прибор для выпечки PST 1201 Серебристый POLARIS CN"},
  {article:"211898", name:"Пылесос PVC 2211 Белый POLARIS CN"},
  {article:"211841", name:"Пылесос портативный PVCS 9806 Белый POLARIS CN"},
  {article:"212325", name:"Увлажнитель воздуха PUH 3040 Графитовый POLARIS CN"},
  {article:"211837", name:"Электрочайник PWK 0503CGL Water Way Pro Черный POLARIS CN"},
  {article:"212416", name:"Электрочайник PWK 1776CA Water Way Pro Стальной POLARIS CN"}
];

let current = 0;
let results = ITEMS.map(it => ({...it, stock:"", order:"", sales:"", filled:false}));
let employeeName = "", store = "";

// ---- онлайн-отправка: позиция уходит в таблицу сразу после «Далее» ----
const STORAGE_KEY = "pw_state_v6";
let sentSig = {}, queue = [], sending = false, lastError = false, retryTimer = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sigOf = r => r.stock + "|" + r.order + "|" + r.sales;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function persist(){
  if(!employeeName) return;
  lsSet(STORAGE_KEY, JSON.stringify({ts:Date.now(), employeeName, store, current,
    results: results.map(r => ({stock:r.stock, order:r.order, sales:r.sales, filled:r.filled})), sentSig, queue}));
}
function loadSaved(){
  try{
    const s = JSON.parse(lsGet(STORAGE_KEY) || "null");
    if(!s || !s.employeeName || !Array.isArray(s.results) || s.results.length !== ITEMS.length) return null;
    if(Date.now() - (s.ts||0) > 3*24*3600*1000) return null;
    return s;
  }catch(e){ return null; }
}
function showResumeIfAny(){
  const s = loadSaved(); if(!s) return;
  const done = s.results.filter(r => r.filled).length; if(!done) return;
  document.getElementById('resumeText').textContent = "Найден незавершённый отчёт: " + s.employeeName +
    ", магазин № " + s.store + ", заполнено " + done + " из " + ITEMS.length + ". Продолжить с того же места?";
  document.getElementById('resumeCard').classList.remove('hidden');
}
function resumeSaved(){
  const s = loadSaved(); if(!s){ discardSaved(); return; }
  employeeName = s.employeeName; store = String(s.store);
  current = Math.min(Math.max(s.current|0, 0), ITEMS.length - 1);
  results = ITEMS.map((it,i) => ({...it, ...s.results[i]}));
  sentSig = s.sentSig || {};
  queue = (s.queue || []).filter(i => i >= 0 && i < ITEMS.length);
  results.forEach((r,i) => { if(r.filled && sentSig[i] !== sigOf(r) && !queue.includes(i)) queue.push(i); });
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-item').classList.remove('hidden');
  renderItem(); pump();
}
function discardSaved(){ lsDel(STORAGE_KEY); document.getElementById('resumeCard').classList.add('hidden'); }

function startChecklist(){
  employeeName = document.getElementById('employeeName').value.trim();
  store = document.getElementById('storeSelect').value;
  if(!employeeName){ alert("Заполните имя"); return; }
  current = 0;
  results = ITEMS.map(it => ({...it, stock:"", order:"", sales:"", filled:false}));
  sentSig = {}; queue = [];
  persist();
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-item').classList.remove('hidden');
  renderItem();
}

function renderItem(){
  const it = ITEMS[current];
  document.getElementById('itemName').textContent = it.name;
  document.getElementById('itemArt').textContent = it.article || "";
  document.getElementById('stockInput').value = results[current].stock;
  document.getElementById('orderInput').value = results[current].order;
  document.getElementById('salesInput').value = results[current].sales;
  document.getElementById('progressNum').textContent = (current+1) + "/" + ITEMS.length;
  document.getElementById('progressFill').style.width = ((current)/ITEMS.length*100) + "%";
  document.getElementById('btnBack').disabled = (current === 0);
  updateSync();
}

function saveCurrent(){
  const st = document.getElementById('stockInput').value;
  const o = document.getElementById('orderInput').value;
  const s = document.getElementById('salesInput').value;
  results[current].stock = st === "" ? 0 : Number(st);
  results[current].order = o === "" ? 0 : Number(o);
  results[current].sales = s === "" ? 0 : Number(s);
  results[current].filled = true;
}

function markDirty(i){
  if(!results[i].filled || sentSig[i] === sigOf(results[i])) return;
  if(!queue.includes(i)) queue.push(i);
  persist(); pump();
}

function nextItem(){
  saveCurrent();
  markDirty(current);
  if(current < ITEMS.length - 1){ current++; persist(); renderItem(); }
  else { persist(); showDone(); }
}

function prevItem(){
  saveCurrent();
  markDirty(current);
  if(current > 0){ current--; persist(); renderItem(); }
}

function showDone(){
  document.getElementById('screen-item').classList.add('hidden');
  document.getElementById('screen-done').classList.remove('hidden');
  const n = results.filter(r => r.filled).length;
  document.getElementById('doneSummary').textContent =
    "Заполнено позиций: " + n + " из " + ITEMS.length + ". Данные уже уходят в таблицу; нажмите «Отправить отчёт», чтобы убедиться, что всё дошло.";
  updateSync();
}

async function postJson(obj, timeoutMs, tries){
  const body = JSON.stringify(obj);
  for(let a = 1; a <= tries; a++){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try{
      await fetch(ENDPOINT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body, signal:ctrl.signal});
      clearTimeout(t); return true;
    }catch(e){ clearTimeout(t); if(a < tries) await sleep(1500 * a); }
  }
  return false;
}

async function pump(){
  if(sending) return;
  sending = true; lastError = false; updateSync();
  while(true){
    queue = queue.filter(i => results[i].filled && sentSig[i] !== sigOf(results[i]));
    if(!queue.length) break;
    const batch = queue.slice(0, 25), sigs = batch.map(i => sigOf(results[i]));
    const ok = await postJson({employee:employeeName, store:store, timestamp:new Date().toISOString(),
      items: batch.map(i => ({article:results[i].article, name:results[i].name,
        stock:results[i].stock, order:results[i].order, sales:results[i].sales}))}, 45000, 3);
    if(ok){ batch.forEach((i,k) => { sentSig[i] = sigs[k]; }); persist(); updateSync(); }
    else { lastError = true; break; }
  }
  sending = false; persist(); updateSync();
  if(lastError && queue.length){ clearTimeout(retryTimer); retryTimer = setTimeout(pump, 8000); }
}
window.addEventListener('online', () => { if(queue.length) pump(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && queue.length) pump(); });

function updateSync(){
  const n = queue.length, sent = Object.keys(sentSig).length;
  let t = "", cls = "sync";
  if(n && sending){ t = "Отправка в таблицу… (в очереди: " + n + ")"; }
  else if(n && lastError){ t = "Нет связи. Введённое сохранено на телефоне, отправим автоматически (в очереди: " + n + ")"; cls = "sync bad"; }
  else if(n){ t = "В очереди на отправку: " + n; }
  else if(sent){ t = "В таблице: " + sent + " поз. ✓"; cls = "sync ok"; }
  ["syncStatus","syncStatusDone"].forEach(id => { const el = document.getElementById(id); if(el){ el.textContent = t; el.className = cls; } });
}

async function submitAll(){
  const btn = document.getElementById('btnSubmit'), p = document.getElementById('doneSummary');
  btn.disabled = true; btn.textContent = "Отправка…";
  results.forEach((r,i) => { if(r.filled && sentSig[i] !== sigOf(r) && !queue.includes(i)) queue.push(i); });
  while(sending) await sleep(300);
  await pump();
  while(sending) await sleep(300);
  const total = results.filter(r => r.filled).length;
  const ok = results.filter((r,i) => r.filled && sentSig[i] === sigOf(r)).length;
  if(ok === total && !queue.length){
    p.textContent = "Отчёт отправлен. Спасибо! Позиций в таблице: " + ok + ".";
    lsDel(STORAGE_KEY); btn.textContent = "Отправлено ✓";
  } else {
    p.textContent = "Отправлено " + ok + " из " + total + ". Нет связи — данные сохранены на телефоне. Нажмите ещё раз, когда появится интернет.";
    btn.disabled = false; btn.textContent = "Отправить отчёт";
  }
}

showResumeIfAny();
</script>
</body>
</html>
