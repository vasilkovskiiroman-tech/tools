<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фото ценников · Polaris</title>
<style>
  :root{
    --bg:#0b0e16; --card:#141a26; --card-line:#232c3d;
    --accent:#f5a623; --text:#eef2f8; --muted:#8f9ab3;
    --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:560px; padding:28px 20px 60px;}
  h1{font-size:22px; margin:6px 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:24px;}

  .card{
    background:var(--card); border:1px solid var(--card-line);
    border-radius:16px; padding:20px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px;}
  select{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--card-line);
    background:#0f141f; color:var(--text); font-size:15px;
  }

  .drop{
    border:2px dashed var(--card-line); border-radius:14px; padding:28px 16px;
    text-align:center; color:var(--muted); font-size:14px; margin-top:16px;
    cursor:pointer;
  }
  .drop.has-files{border-color:var(--accent); color:var(--text);}
  input[type=file]{display:none;}

  .thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .thumbs img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--card-line);}

  button.send{
    width:100%; padding:16px; border:none; border-radius:12px;
    background:var(--accent); color:#1a1200; font-size:16px; font-weight:700;
    margin-top:18px; cursor:pointer;
  }
  button.send:disabled{opacity:.5;}

  .status{margin-top:14px; font-size:14px; text-align:center;}
  .status.ok{color:var(--ok);}
  .status.bad{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Фото ценников</h1>
  <div class="sub">Сфотографируйте ценники или терминалы — фото уйдут напрямую в общую папку.</div>

  <div class="card">
    <label>Магазин</label>
    <select id="store">
      <option value="20">№ 20</option>
    </select>

    <div class="drop" id="drop">
      Нажмите, чтобы выбрать или сделать фото
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <div class="thumbs" id="thumbs"></div>

    <button class="send" id="sendBtn" disabled>Отправить фото</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbz66yM97oIQLCXPiZR0K968sdxUD9v3E3XX8sj7L8fc7deLMzOqFIN61jRQRFOqhTHYtA/exec";

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const thumbs = document.getElementById('thumbs');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

let selectedFiles = [];

drop.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files);
  thumbs.innerHTML = '';
  selectedFiles.forEach(file => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    thumbs.appendChild(img);
  });
  drop.classList.toggle('has-files', selectedFiles.length > 0);
  drop.textContent = selectedFiles.length
    ? `Выбрано фото: ${selectedFiles.length} (нажмите, чтобы изменить)`
    : 'Нажмите, чтобы выбрать или сделать фото';
  sendBtn.disabled = selectedFiles.length === 0;
});

// Сжимаем фото перед отправкой, чтобы не грузить мобильный интернет и не упереться в лимиты Apps Script
function resizeImage(file, maxSize = 1600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) {
        height = Math.round(height * (maxSize / width));
        width = maxSize;
      } else if (height > maxSize) {
        width = Math.round(width * (maxSize / height));
        height = maxSize;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

sendBtn.addEventListener('click', async () => {
  sendBtn.disabled = true;
  statusEl.textContent = 'Готовим фото...';
  statusEl.className = 'status';

  try {
    const photos = await Promise.all(selectedFiles.map(f => resizeImage(f)));

    statusEl.textContent = 'Отправляем...';

    await fetch(ENDPOINT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({
        store: document.getElementById('store').value,
        photos: photos
      })
    });

    statusEl.textContent = 'Отправлено! Можно закрывать страницу.';
    statusEl.className = 'status ok';
    selectedFiles = [];
    thumbs.innerHTML = '';
    drop.textContent = 'Нажмите, чтобы выбрать или сделать фото';
    drop.classList.remove('has-files');
  } catch (err) {
    statusEl.textContent = 'Ошибка отправки, попробуйте ещё раз';
    statusEl.className = 'status bad';
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
